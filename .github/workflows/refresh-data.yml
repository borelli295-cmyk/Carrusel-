name: Actualizar datos

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer datos de Instagram y Facebook
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: node scripts/refresh-data.mjs
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet docs/data.json; then
            git config user.name "actualizador"
            git config user.email "actualizador@users.noreply.github.com"
            git add docs/data.json
            git commit -m "Actualizar datos"
            git push
          fi
